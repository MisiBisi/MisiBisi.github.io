<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomCip.pl</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Georgia, serif;
            overflow: hidden;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            filter: brightness(0.55);
        }

        .hero-text {
            position: absolute;
            top: 75%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            width: 90%;
        }

        .hero-text h1 {
            font-size: 3em;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .hero-text p {
            font-size: 1.5em;
            color: #f0c060;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .badge {
            margin-top: 30px;
            display: inline-block;
            background: rgba(255,255,255,0.15);
            border: 2px solid white;
            padding: 12px 30px;
            border-radius: 50px;
            font-size: 1em;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>

    <div class="hero">
        <img src="tomek.jpg" alt="Tomek">
        <div class="hero-text">
            <h1>Więcej uśmiechu,<br>panie Tomku! 😄</h1>
            <p>KetoDżek grasuje w pobliżu</p>
            <div class="badge">⏳ Niedługo start!</div>
        </div>
    </div>

</body>
</html>
