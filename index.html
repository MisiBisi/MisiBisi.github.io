<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TomCip.pl</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            height: 100vh;
            font-family: Georgia, serif;
            overflow: hidden;
        }

        .hero {
            position: relative;
            width: 100%;
            height: 100vh;
        }

        .hero img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            object-position: center 20%;
            filter: brightness(0.55);
        }

        .hero-text {
            position: absolute;
            top: 75%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            text-shadow: 2px 2px 8px rgba(0,0,0,0.8);
            width: 90%;
        }

        .hero-text h1 {
            font-size: 3em;
            margin-bottom: 16px;
            line-height: 1.2;
        }

        .hero-text p {
            font-size: 1.5em;
            color: #f0c060;
            letter-spacing: 2px;
            text-transform: uppercase;
        }

        .countdown {
            margin-top: 20px;
            display: flex;
            justify-content: center;
            gap: 20px;
        }

        .countdown-box {
            background: rgba(0,0,0,0.45);
            border: 2px solid rgba(255,255,255,0.4);
            border-radius: 12px;
            padding: 12px 20px;
            min-width: 80px;
        }

        .countdown-box span {
            display: block;
            font-size: 2.2em;
            font-weight: bold;
            color: #f0c060;
            line-height: 1;
        }

        .countdown-box small {
            font-size: 0.75em;
            color: #ccc;
            letter-spacing: 1px;
            text-transform: uppercase;
        }
    </style>
</head>
<body>

    <div class="hero">
        <img src="tomek.jpg" alt="Tomek">
        <div class="hero-text">
            <h1>Więcej uśmiechu,<br>panie Tomku! 😄</h1>
            <p>KetoDżek grasuje w pobliżu</p>
            <div class="countdown">
                <div class="countdown-box">
                    <span id="days">00</span>
                    <small>dni</small>
                </div>
                <div class="countdown-box">
                    <span id="hours">00</span>
                    <small>godz</small>
                </div>
                <div class="countdown-box">
                    <span id="minutes">00</span>
                    <small>min</small>
                </div>
                <div class="countdown-box">
                    <span id="seconds">00</span>
                    <small>sek</small>
                </div>
            </div>
        </div>
    </div>

    <script>
        const target = new Date('2026-06-14T07:00:00');

        function update() {
            const now = new Date();
            const diff = target - now;

            if (diff <= 0) {
                document.querySelector('.countdown').innerHTML = '<p style="color:#f0c060;font-size:1.5em">🎉 Już jesteśmy!</p>';
                return;
            }

            const days = Math.floor(diff / (1000 * 60 * 60 * 24));
            const hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
            const minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
            const seconds = Math.floor((diff % (1000 * 60)) / 1000);

            document.getElementById('days').textContent = String(days).padStart(2, '0');
            document.getElementById('hours').textContent = String(hours).padStart(2, '0');
            document.getElementById('minutes').textContent = String(minutes).padStart(2, '0');
            document.getElementById('seconds').textContent = String(seconds).padStart(2, '0');
        }

        update();
        setInterval(update, 1000);
    </script>

</body>
</html>
